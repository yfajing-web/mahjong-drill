<script id="mod-course-betaori">
// ベタオリコースの画面。app.html の共通部品を使う
(function () {
  'use strict';

  // ★2軸の言い分け。安全牌＝浮いている安全牌を切る／ベタオリ＝形を崩して安全牌を切る／
  //   ただの損＝形を崩したうえに危険牌。順子を崩してスジを切るのは損ではない
  // ★目盛りは危険の度合い。形を崩したかは別の注記（2026-09-11）
  var STANCE = {
    anzen:   { label: '安全牌',       color: 'var(--ok)',   bg: 'var(--ok-bg)',   desc: '最も安全な牌とほぼ同じ。形も崩れていない' },
    betaori: { label: 'ベタオリ',     color: 'var(--ok)',   bg: 'var(--ok-bg)',   desc: '安全側の牌を、形を崩して切った。正しい降り方' },
    mawashi: { label: '回し',         color: 'var(--warn)', bg: 'var(--warn-bg)', desc: '少し危険だが、形は残した' },
    hikaeme: { label: '控えめな勝負', color: 'var(--warn)', bg: 'var(--warn-bg)', desc: '無スジだが暴牌ではない。危険牌の中では低いほう' },
    shoubu:  { label: '勝負',         color: 'var(--bad)',  bg: 'var(--bad-bg)',  desc: '危険牌。見合う手のときだけ' },
    bouhai:  { label: '暴牌',         color: 'var(--bad)',  bg: 'var(--bad-bg)',  desc: 'この手でいちばん当たる牌、またはそれに近い' }
  };
  var STEP_KEYS = ['anzen', 'betaori', 'mawashi', 'hikaeme', 'shoubu', 'bouhai'];

  // ★河は6枚で折り返す。宣言牌は横向きに置くので、回した分の場所を先に確保する
  function riverBlock(q, withBadges) {
    var size = window.innerWidth < 560 ? 0.72 : 0.95;
    var w = Math.round(T.W * size), h = Math.round(T.H * size), gap = 4;
    var rk = el('<div class="rack"></div>');
    var row = el('<div class="river"></div>');
    row.style.maxWidth = (w * 6 + gap * 5 + (h - w)) + 'px';
    row.style.gap = gap + 'px';
    q.river.forEach(function (t, i) {
      var isReach = i === q.reachIndex;
      var isTedashi = i === q.tedashiIndex;
      var wrap = document.createElement('span');
      var inner = document.createElement('span');
      inner.innerHTML = T.svg(t, { size: size, state: isTedashi ? 'worst' : undefined });
      var bg = withBadges ? seenBadge(q, t) : 0;
      if (bg && !isReach) {
        inner.style.cssText = 'position:relative;display:inline-block';
        inner.appendChild(el('<span class="badge' + (bg >= 4 ? ' wall' : '') + '">' + bg + '</span>'));
      }
      if (isReach) {
        wrap.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;' +
          'width:' + h + 'px;height:' + w + 'px;flex:none';
        inner.style.cssText = 'display:block;transform:rotate(90deg)';
      } else {
        wrap.style.cssText = 'display:inline-flex;flex:none';
      }
      wrap.appendChild(inner);
      row.appendChild(wrap);
    });
    rk.appendChild(row);
    return rk;
  }

  // 他家の河に見えている牌（壁の材料）
  function otherSeen(q, withBadges) {
    var list = [];
    for (var t = 0; t < 34; t++) for (var k = 0; k < (q.otherDiscards ? q.otherDiscards[t] : 0); k++) list.push(t);
    if (!list.length) return null;
    var box = el('<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px"></div>');
    box.appendChild(el('<span style="font-size:14px;color:var(--fg2);flex:none">他家の河に見えている牌</span>'));
    var row = el('<div class="row" style="gap:3px"></div>');
    list.forEach(function (t) { row.appendChild(tileSpan(t, 0.68, undefined, withBadges ? seenBadge(q, t) : 0)); });
    box.appendChild(row);
    return box;
  }

  function situationLine(q) {
    return el('<div style="font-size:17px;color:var(--bad);font-weight:600;margin-bottom:8px">' +
      q.seatName + '（' + B.tileName(q.theirWind) + '家）がリーチ　' + q.turn + '巡目</div>');
  }

  window.q2Start = function () {
    var c = el('<div class="card"></div>');
    c.appendChild(cardHead('', dotColors()));
    c.appendChild(el('<div class="calc">局面を作って、放銃の回数を数えています…</div>'));
    render(c);
    setTimeout(function () {
      var q = B.makeQuestion();
      if (!q) { alert('局面をうまく作れませんでした。'); return screenStart(); }
      state.q = q;
      // 履歴に「計算中」を残さない
      screens.pop(); screenPos--;
      showQuestion();
    }, 30);
  };

  function showQuestion() {
    var q = state.q;
    var c = el('<div class="card"></div>');
    c.appendChild(cardHead('東1局　あなたは<b style="color:var(--fg)">' + B.tileName(q.mySeat) + '家</b>', dotColors()));
    c.appendChild(situationLine(q));
    c.appendChild(riverBlock(q));
    c.appendChild(el('<div class="note" style="margin-top:8px">赤い枠は手出し。横向きがリーチ宣言牌。</div>'));
    var os = otherSeen(q); if (os) c.appendChild(os);

    c.appendChild(el('<div style="font-size:20px;margin:22px 0 12px">切る牌を選んでくださいね</div>'));
    var rack = el('<div class="rack"></div>');
    var row = document.createElement('div');
    row.className = 'row hand';
    var tiles = handList(q.hand);
    var lay = handLayout(tiles.length, 4);
    row.style.flexWrap = 'wrap';
    row.style.maxWidth = lay.width + 'px';
    row.style.margin = '0 auto';
    tiles.forEach(function (idx) { row.appendChild(tileBtn(idx, onPick, lay.size)); });
    rack.appendChild(row);
    c.appendChild(rack);
    render(c);
  }

  function onPick(idx) {
    var q = state.q, v = B.judge(q, idx);
    var meta = STANCE[v.key];
    pushResult({ key: v.key, lossPP: v.lossPP, color: meta.color, safest: v.safest, breaksDanger: v.breaks && !v.safeish });
    feedback(idx, v);
  }

  function optionOf(q, tile) {
    for (var i = 0; i < q.options.length; i++) if (q.options[i].tile === tile) return q.options[i];
    return null;
  }

  // 回答後の手牌。各牌の下に放銃回数を添え、選んだ牌と最安全牌に枠を付ける
  function handWithCounts(q, picked, onTile) {
    var list = handList(q.hand);
    var lay = handLayout(list.length, 4);
    var rk = el('<div class="rack"></div>');
    var row = document.createElement('div');
    row.className = 'row hand';
    row.style.cssText = 'flex-wrap:wrap;gap:4px;max-width:' + lay.width + 'px;margin:0 auto;align-items:flex-start';
    list.forEach(function (idx) {
      var o = optionOf(q, idx);
      var w = document.createElement(onTile ? 'button' : 'div');
      if (onTile) { w.type = 'button'; w.className = 'tilebtn'; w.onclick = function () { onTile(o); }; }
      w.style.cssText = 'text-align:center;width:' + lay.tileWidth + 'px;transition:none';
      var st = idx === picked ? 'picked' : (idx === q.safest.tile ? 'best' : (idx === q.riskiest.tile ? 'worst' : undefined));
      w.innerHTML = T.svg(idx, { size: lay.size, state: st });
      var bg = seenBadge(q, idx);
      if (bg) {
        var fs0 = w.firstChild; var wrapB = document.createElement('span');
        wrapB.style.cssText = 'position:relative;display:inline-block';
        wrapB.appendChild(fs0); wrapB.appendChild(el('<span class="badge' + (bg >= 4 ? ' wall' : '') + '">' + bg + '</span>'));
        w.insertBefore(wrapB, w.firstChild);
      }
      var cap = document.createElement('div');
      cap.style.cssText = 'font-size:12px;color:#f4f2ea;margin-top:3px;line-height:1.2;font-variant-numeric:tabular-nums';
      cap.textContent = o ? o.hits.toLocaleString() : '';
      w.appendChild(cap);
      row.appendChild(w);
    });
    rk.appendChild(row);
    return rk;
  }

  // 当たる形の1行。河の牌が残した形なら、その捨て牌を薄く並べて「4 45」のように見せる
  function shapeLine(o, origin, q) {
    if (q && o.dead === null && o.type !== '単騎' && o.type !== 'シャンポン') {
      o.thin = o.kept.filter(function (k) { return q.visible[k] === 3; });
    }
    var line = el('<div class="shape"></div>');
    if (o.dead !== null) line.style.opacity = '.5';
    var g = document.createElement('span');
    g.style.cssText = 'display:flex;gap:3px;align-items:center;width:118px;flex:none';
    var seq = o.kept.slice();
    if (origin) seq.push(origin.discard);
    seq.sort(function (a, b) { return a - b; });
    var dimmed = false;   // 捨て牌と同じ牌が残りにもある場合、薄くするのは1枚だけ
    seq.forEach(function (k) {
      var sp = tileSpan(k, 0.8);
      if (origin && !dimmed && k === origin.discard) { sp.style.cssText = 'opacity:.38;filter:grayscale(.4)'; dimmed = true; }
      g.appendChild(sp);
    });
    line.appendChild(g);
    line.appendChild(el('<span class="arrow">→</span>'));
    var w = document.createElement('span');
    w.style.cssText = 'display:flex;gap:3px;width:84px;flex:none';
    o.waits.forEach(function (x) { w.appendChild(tileSpan(x, 0.8)); });
    line.appendChild(w);
    var note;
    if (o.dead !== null) {
      note = o.deadBy === 'wall'
        ? '<span style="color:var(--ok)">消滅　' + T.label(o.dead) + 'が4枚見えているので、この形は作れません（壁）</span>'
        : '<span style="color:var(--ok)">消滅　' + T.label(o.dead) + 'が河にあるので和了れません</span>';
    } else if (origin) {
      note = '<b style="color:var(--bad)">' + origin.name + '</b>　<span style="color:var(--fg3)">' +
        origin.turn + '巡目に' + T.label(origin.discard) + 'を切って、この形が残った</span>';
    } else {
      note = o.type;
    }
    if (o.dead === null && o.thin && o.thin.length) {
      note += '　<span style="color:#5b3fa6">残り1枚（' + o.thin.map(T.label).join('・') + 'が3枚見え）</span>';
    }
    line.appendChild(el('<span style="font-size:13.5px;color:var(--fg2);line-height:1.4">' + note + '</span>'));
    return line;
  }

  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    var x = a.slice().sort(), y = b.slice().sort();
    for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
    return true;
  }

  function feedback(picked, v) {
    var q = state.q, s = q.safest, mine = v.mine, r = q.riskiest;
    var meta = STANCE[v.key];
    var c = el('<div class="card"></div>');
    c.appendChild(cardHead('東1局　あなたは<b style="color:var(--fg)">' + B.tileName(q.mySeat) + '家</b>', dotColors()));

    // 判定
    var headline;
    if (v.key === 'anzen' || v.key === 'betaori') {
      headline = (v.safest ? 'この手でいちばん当たりにくい一打です。'
        : v.isSafe ? '当たりにくい牌です（いちばん安全な' + T.label(s.tile) + 'との差は ' + v.lossPP.toFixed(1) + 'ポイント）。'
        : '安全側の牌です。ただし、いちばん安全な' + T.label(s.tile) + 'より ' + v.lossPP.toFixed(1) + 'ポイント当たりやすい。') +
        (v.key === 'betaori' ? '<br><span style="font-size:15px;color:var(--fg2)">形は崩れますが、降りると決めたなら正しい一打です。</span>'

    } else {
      var ratio = s.rate > 0 ? (mine.rate / s.rate) : 0;
      headline = T.label(s.tile) + 'を切る場合の <b>' +
        (ratio >= 2 ? ratio.toFixed(1) + '倍' : '+' + v.lossPP.toFixed(1) + 'ポイント') + '</b> の危険があります。';
      if (v.key === 'hikaeme') headline += '<br><span style="font-size:15px;color:var(--fg2)">危険牌の中では低いほう。押すなら、こういう牌から。</span>';
      if (v.key === 'bouhai') headline += '<br><span style="font-size:15px;color:var(--fg2)">この一打が見合うのは、跳満クラスの聴牌のときです。</span>';
    }
    // ★形を崩したかは、目盛りとは別に注記する
    if (v.breaks && !v.safeish) {
      headline += '<br><span style="font-size:15px;color:var(--bad)">しかも形が崩れます（牌効率だけなら ' + T.label(q.effBest.tile) + ' 切り）。降りるなら安全側の牌、押すなら形を残す牌があります。</span>';
    }
    var top = document.createElement('div');
    top.style.cssText = 'display:flex;gap:22px;align-items:center';

    top.appendChild(el('<div><div class="verdict" style="color:' + meta.color + '">' + meta.label + '</div>' +
      '<div style="margin-top:4px">' + headline + '</div></div>'));
    c.appendChild(top);

    // ★目盛りはボタン。押すと、その勝負になる牌が見える
    var groups = {};

    var waysBox = document.createElement('div');

    STEP_KEYS.forEach(function (k) {
      var m = STANCE[k];
      var d = el('<div><button type="button">' + m.label +
        '<span style="display:block;font-size:11px;opacity:.75">' + (groups[k] ? groups[k].length + '枚' : '—') + '</span></button></div>');
      if (k === v.key) { d.style.background = m.bg; d.style.color = m.color; d.style.fontWeight = '600'; }
      d.querySelector('button').onclick = function () {
        if (openKey === k) { listBox.hidden = true; openKey = null; return; }
        openKey = k;
        listBox.hidden = false;
        listBox.innerHTML = '';
        listBox.appendChild(el('<div style="font-size:14px;color:' + m.color + ';font-weight:600;margin-bottom:2px">' + m.label + 'になる牌</div>'));
        listBox.appendChild(el('<div class="note" style="margin:0 0 8px">' + m.desc + '。牌を押すと、下の「当たる形」がその牌に切り替わります。</div>'));
        if (!groups[k]) { listBox.appendChild(el('<div class="note" style="margin:0">この手牌にはありません。</div>')); return; }
        var rw = el('<div class="row" style="gap:10px"></div>');
        groups[k].forEach(function (g) {
          var w = el('<button type="button" class="tilebtn" style="text-align:center;transition:none"></button>');
          w.innerHTML = T.svg(g.o.tile, { size: 0.95 });
          w.appendChild(el('<div style="font-size:12.5px;color:var(--fg2);margin-top:3px">' + g.o.hits.toLocaleString() + '回</div>'));
          w.onclick = function () { jumpWays(g.o); };
          rw.appendChild(w);
        });
        listBox.appendChild(rw);
      };
      sc.appendChild(d);
    });
    c.appendChild(sc);
    c.appendChild(listBox);
    c.appendChild(el('<div class="note" style="margin-top:-12px">' + meta.desc + '。' +
      '目盛りは<b>どれくらいの危険を取ったか</b>を示すもので、良し悪しの判定ではありません。押すと、その段の牌が見えます。</div>'));

    // ★河と手牌を再掲する。これが無いと振り返れない
    c.appendChild(el('<div class="sect">局面</div>'));
    c.appendChild(situationLine(q));
    c.appendChild(riverBlock(q, true));
    var os2 = otherSeen(q, true); if (os2) c.appendChild(os2);
    if (q.options.some(function (o) { return seenBadge(q, o.tile) >= 3; }) ||
        q.river.some(function (t) { return seenBadge(q, t) >= 3; })) {
      c.appendChild(el('<div class="note" style="margin-top:6px">牌の右上の数字は、場に見えている枚数（自分の手牌も含む）。' +
        '<span style="color:#b3392a;font-weight:600">赤の4</span>＝壁、<span style="color:#5b3fa6;font-weight:600">紫の3</span>＝ワンチャンス。</div>'));
    }
    c.appendChild(el('<div class="sect">手牌と、それぞれの放銃回数（' + q.samples.toLocaleString() + '回中）</div>'));
    c.appendChild(handWithCounts(q, picked, jumpWays));
    c.appendChild(el('<div class="note" style="margin-top:6px">金の枠があなた、緑が最も安全、赤が最も危険。牌を押すと、その牌の「当たる形」が下に出ます。</div>'));

    // 3枚比較
    c.appendChild(el('<div class="sect">放銃した回数</div>'));
    var rows = [];
    rows.push({ tile: s.tile, lab: mine.tile === s.tile ? '最も安全（あなた）' : '最も安全', v: s.hits, col: 'var(--ok)', text: s.hits.toLocaleString() });
    if (mine.tile !== s.tile && mine.tile !== r.tile) rows.push({ tile: mine.tile, lab: 'あなた', v: mine.hits, col: 'var(--warn)', text: mine.hits.toLocaleString() });
    if (r.tile !== s.tile) rows.push({ tile: r.tile, lab: mine.tile === r.tile ? '最も危険（あなた）' : '最も危険', v: r.hits, col: 'var(--bad)', text: r.hits.toLocaleString() });
    c.appendChild(bars(rows));

    // ★当たる形。牌を押すと切り替わる。河の牌が残した形は、捨て牌も並べて「4 45」の形で見せる
    function renderWays(target) {
      waysBox.innerHTML = '';
      var j = B.judge(q, target.tile), sm = STANCE[j.key];
      var tags = document.createElement('div');
      tags.style.margin = '0 0 10px';
      tags.appendChild(el('<span class="tag" style="background:' + sm.bg + ';color:' + sm.color + '">' + sm.label + '</span>'));
      target.labels.forEach(function (l) { tags.appendChild(el('<span class="tag ' + l.dir + '">' + l.text + '</span>')); });
      waysBox.appendChild(el('<div class="sect">' + T.label(target.tile) + 'に当たる形' +
        '<span style="color:var(--fg3)">（' + target.hits.toLocaleString() + '回' +
        (target.tile === picked ? '・あなたの一打' : target.tile === s.tile ? '・最も安全' : target.tile === r.tile ? '・最も危険' : '') + '）</span></div>'));
      waysBox.appendChild(tags);

      var ways = Danger.waysToHit(target.tile, q.ownDiscards, q.visible);
      var origins = Danger.originsOf(target.tile, q.river, q.ownDiscards);
      var deadCount = 0;
      ways.forEach(function (o) {
        if (o.dead !== null) deadCount++;
        var origin = null;
        for (var i = 0; i < origins.length; i++) {
          if (origins[i].name !== 'カンチャン' && origins[i].name !== 'ペンチャン' && sameSet(origins[i].kept, o.kept)) { origin = origins[i]; break; }
        }
        waysBox.appendChild(shapeLine(o, origin, q));
      });
      var isHonor = target.tile >= 27;
      waysBox.appendChild(el('<div class="note" style="margin-top:8px">' + ways.length + '通りのうち <b>' + deadCount + '通り</b> が河で消えています。' +
        (deadCount === 0 && !isHonor ? ' 1つも消えていないので、これを<b>完全無筋</b>と呼びます。' : '') +
        (isHonor ? ' 字牌はシャンポンと単騎でしか当たりません。残り枚数がすべてです。' +
          '<br><span style="color:var(--bad)">★ただし相手がチャンタや染め手（字牌を使う手）なら別。河に中張牌が早くから並んでいたら疑ってください。</span>' : '') + '</div>'));

      // ★壁・ワンチャンスは、何が何枚見えていて、どの形が消えたかを文章にする（2026-09-11 指摘）
      var isEdge = false;
      var wallDead = ways.filter(function (o) { return o.deadBy === 'wall'; });
      var thinKept = [], thinForms = [], fullForms = [], sujiDead = [];
      ways.forEach(function (o) {
        if (isEdge || o.type === '単騎' || o.type === 'シャンポン') return;
        if (o.dead !== null) { if (o.deadBy === 'furiten') sujiDead.push(o); return; }
        var thin = o.kept.filter(function (k) { return q.visible[k] === 3; });
        if (thin.length) { thinForms.push(o); thin.forEach(function (k) { if (thinKept.indexOf(k) < 0) thinKept.push(k); }); }
        else fullForms.push(o);
      });
      if (wallDead.length) {
        var wl = wallDead.map(function (o) { return T.label(o.dead) + 'が4枚見えているので ' + o.kept.map(T.label).join('') + ' の形'; });
        waysBox.appendChild(el('<div class="callout ok"><b>壁。</b>' + wl.join('、') + 'は作れません。' +
          'その分、この牌は当たりにくくなっています（' + target.hits.toLocaleString() + '回）。' +
          (wallDead.length === ways.filter(function (o) { return o.type !== '単騎' && o.type !== 'シャンポン'; }).length
            ? '<br>リャンメンもカンチャンも全部消えたので<b>ノーチャンス</b>。残るのは単騎とシャンポンだけです。' : '') + '</div>'));
      } else if (thinKept.length) {
        var thinTxt = thinKept.map(T.label).join('・') + 'が3枚見えているので、' +
          thinForms.map(function (o) { return o.kept.map(T.label).join(''); }).join('・') + ' の形は残り1枚でしか作れません。';
        if (!fullForms.length && sujiDead.length) {
          // ★スジとワンチャンスの複合。片側はスジで消え、残る側は残り1枚
          waysBox.appendChild(el('<div class="callout ok"><b>スジとワンチャンスの複合。</b>' +
            sujiDead.map(function (o) { return T.label(o.dead) + 'が河にあるので ' + o.kept.map(T.label).join('') + ' は消え'; }).join('、') + '、' +
            '残る側は' + thinTxt + 'つまりリャンメンでは<b>ほぼ当たらない</b>牌になっています（' + target.hits.toLocaleString() + '回）。' +
            '<br><span style="font-size:13.5px;color:var(--fg2)">ワンチャンスが効くのは、こうして<b>もう片側がスジで消えているとき</b>です。</span></div>'));
        } else if (!fullForms.length) {
          waysBox.appendChild(el('<div class="callout ok"><b>ワンチャンス。</b>' + thinTxt +
            'リャンメン・カンチャンが全部その形なので、この牌は低めに出ています（' + target.hits.toLocaleString() + '回）。</div>'));
        } else {
          waysBox.appendChild(el('<div class="callout warn"><b>ワンチャンスですが、効きは薄い。</b>' + thinTxt +
            'ただし ' + fullForms.map(function (o) { return o.kept.map(T.label).join(''); }).join('・') + ' の形はそのまま生きているので、' +
            '安全牌としては使えません（' + target.hits.toLocaleString() + '回）。' +
            '<br><span style="font-size:13.5px;color:var(--fg2)">ワンチャンスは、もう片側がスジで消えていて初めて効きます。</span></div>'));
        }
      }
      // ★無筋の端牌は、中張牌の無筋と比べて見せる。それしか切れない場面がある
      var tn = target.tile < 27 ? target.tile % 9 : -1;
      if ((tn === 0 || tn === 8) && target.labels.some(function (l) { return l.text === '完全無筋'; })) {
        var midMusuji = q.options.filter(function (o) {
          var m = o.tile < 27 ? o.tile % 9 : -1;
          return m >= 2 && m <= 6 && o.labels.some(function (l) { return l.text === '完全無筋'; });
        });
        var mm = midMusuji.length ? Math.round(midMusuji.reduce(function (a, o) { return a + o.hits; }, 0) / midMusuji.length) : null;
        waysBox.appendChild(el('<div class="callout ok">無筋ですが<b>端牌</b>です。当たる形はリャンメン1本・単騎・シャンポンの' + ways.length + '通りで、' +
          '中張牌の5通りより少ない。この局面でも ' + target.hits.toLocaleString() + '回' +
          (mm !== null ? '（中張牌の無筋は平均 ' + mm.toLocaleString() + '回）' : '') + '。' +
          '<br><span style="font-size:13.5px;color:var(--fg2)">無筋しか切れないときは、端牌から。</span>' +
          '<br><span style="font-size:13.5px;color:var(--bad)">★ただし相手がチャンタや染め手なら逆で、端牌と字牌がいちばん危険になります。河に中張牌が早くから並んでいたら疑ってください（手役読みコース）。</span></div>'));
      }
      // ★序盤の捨て牌に由来するまたぎ筋・裏筋は、完全無筋の平均と比べて見せる
      var earlyOrg = origins.filter(function (o) { return o.turn <= 3 && (o.name === 'またぎ筋' || o.name === '裏筋'); });
      if (earlyOrg.length) {
        var musuji = q.options.filter(function (o) { return o.labels.some(function (l) { return l.text === '完全無筋'; }); });
        var mAvg = musuji.length ? musuji.reduce(function (a, o) { return a + o.hits; }, 0) / musuji.length : null;
        var eo = earlyOrg[0];
        waysBox.appendChild(el('<div class="callout ok">' + eo.name + 'ですが、' + eo.turn + '巡目という<b>序盤</b>に切られた' + T.label(eo.discard) + 'の形です。' +
          '序盤に切った牌の周辺は手に残っていにくいので、この計算でも ' + target.hits.toLocaleString() + '回' +
          (mAvg !== null ? '（この手の完全無筋の平均 ' + Math.round(mAvg).toLocaleString() + '回）' : '') +
          (mAvg !== null && target.hits < mAvg ? 'と、無筋より低めに出ています。' : 'です。') +
          '<br><span style="font-size:13.5px;color:var(--fg2)">中盤以降に手出しされた牌のまたぎ筋とは、危険度が違います。</span></div>'));
      }
      if (target.labels.some(function (l) { return l.text.indexOf('スジ') >= 0; })) {
        waysBox.appendChild(el('<div class="callout warn">スジはリャンメン待ちにしか効きません。' +
          '<b>カンチャン・ペンチャン・シャンポン・単騎には一切効きません。</b>この牌も、そこからは当たります。</div>'));
      }
      if (j.breaks) {
        waysBox.appendChild(el('<div class="callout ' + (j.safeish ? 'ok' : 'bad') + '">この牌を切ると<b>手の形が崩れます</b>' +
          '（牌効率だけなら ' + T.label(q.effBest.tile) + ' 切り）。' +
          (j.safeish ? '安全側の牌なので、降りると決めたならこれで正しい。' : '崩したうえに危険牌です。降りるなら安全側の牌、押すなら形を残す牌があります。') + '</div>'));
      }
    }
    c.appendChild(waysBox);
    renderWays(mine);

    c.appendChild(allOptionsToggle(q.options.map(function (o) {
      var isS = o.tile === s.tile, isM = o.tile === mine.tile;
      var j = B.judge(q, o.tile);
      return {
        tile: o.tile,
        lab: isS ? '最も安全' : isM ? 'あなた' : '',
        mid: '<span style="color:' + STANCE[j.key].color + '">' + STANCE[j.key].label + '</span>　' +
          o.labels.map(function (l) { return l.text; }).join('・'),
        value: o.hits.toLocaleString() + '回',
        bg: isS ? 'var(--ok-bg)' : (isM ? 'var(--warn-bg)' : '')
      };
    }), '同じ局面の中での比較です。巡目や場が違う局面の回数と並べないでください。'));

    c.appendChild(nextButton(afterAnswer));
    render(c);
  }
})();

</script>
<script id="mod-course-yomi">
// 手役読みコースの画面。app.html の共通部品を使う
(function () {
  'use strict';

  var STAGE_LABEL = { sample: '見本', similar: '類例', judge: '見わけ' };
  // ★「取り違え」とは言わない。河から手役は断定できないので、可能性の問題として扱う
  var RESULT = {
    hit: { label: '正解', color: 'var(--ok)' },
    falseAlarm: { label: '疑いすぎ', color: 'var(--warn)' },
    missed: { label: '見逃し', color: 'var(--bad)' },
    other: { label: '別の手役でした', color: 'var(--warn)' }
  };

  // ★河は6枚で折り返す。実際の河と同じ並びにしないと、パターンとして覚えられない
  function riverRack(river, size) {
    var sz = size || (window.innerWidth < 560 ? 0.72 : 0.95), w = Math.round(T.W * sz), gap = 4;
    var rk = el('<div class="rack"></div>');
    var row = el('<div class="river"></div>');
    row.style.maxWidth = (w * 6 + gap * 5) + 'px';
    row.style.gap = gap + 'px';
    river.forEach(function (t) { row.appendChild(tileSpan(t, sz)); });
    rk.appendChild(row);
    return rk;
  }

  window.q3Start = function () {
    var q = Y.makeQuestion(state.i);
    state.q = q;
    var c = el('<div class="card"></div>');
    c.appendChild(cardHead(STAGE_LABEL[q.stage], dotColors()));

    if (q.stage === 'sample') {
      c.appendChild(el('<div class="callout ok" style="margin-top:0">これは<b>見本</b>です。' +
        'まず典型の形を目に入れてください。答えは選んだあとすぐ出ます。</div>'));
    }

    c.appendChild(el('<div style="font-size:20px;margin:16px 0 10px">この河から、何がいちばん考えられますか</div>'));
    c.appendChild(riverRack(q.river));

    var box = el('<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"></div>');
    Y.ORDER.forEach(function (k) {
      var b = el('<button class="act">' + Y.KINDS[k].name + '</button>');
      b.onclick = function () { onPick(k); };
      box.appendChild(b);
    });
    c.appendChild(box);
    c.appendChild(el('<div class="note">「普通の手」も選択肢です。' +
      '色が少し偏っただけで警戒すると、安全牌を無駄に抱えて手が潰れます。<br>' +
      '出てくる順位は<b>このドリルが作る河の中での可能性</b>で、実戦の統計ではありません。</div>'));
    render(c);
  };

  function onPick(choice) {
    var q = state.q, v = Y.judge(q, choice);
    var meta = RESULT[v.key];
    pushResult({ key: v.key, color: meta.color });
    feedback(choice, v);
  }

  function feedback(choice, v) {
    var q = state.q;
    var meta = RESULT[v.key];
    var c = el('<div class="card"></div>');
    c.appendChild(cardHead(STAGE_LABEL[q.stage], dotColors()));

    var sub;
    if (v.key === 'hit') sub = 'この河は <b>' + Y.KINDS[q.answer].short + '</b> でした。';
    else if (v.key === 'other') sub = 'この河は <b>' + Y.KINDS[q.answer].short + '</b> でした。' + Y.KINDS[choice].short + 'の可能性も' +
      (v.rank <= 2 ? 'ありました（可能性の順で' + v.rank + '番目）。' : '無くはありませんが、順位は' + v.rank + '番目です。');
    else if (v.key === 'missed') sub = 'この河は <b>' + Y.KINDS[q.answer].short + '</b> でした。警戒しないと、安全牌の順番を取り違えます。';
    else sub = 'この河は <b>普通の手</b> でした。' + Y.KINDS[choice].short + 'に見えましたが、いつもの安全度で大丈夫です。';

    c.appendChild(el('<div><div class="verdict" style="color:' + meta.color + '">' + meta.label + '</div>' +
      '<div style="margin-top:4px;font-size:17px">' + sub + '</div></div>'));

    // ★可能性の順。断定しない。順番だけを主役にし、数字はトグルの中（2026-09-12 指摘）。
    //   半分以上の問題で1位が90%を超え、棒グラフが「100%対0%」の断定に見えていた
    function rankLine(list, showAns) {
      var line = el('<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 0;margin:4px 0 6px"></div>');
      list.forEach(function (r, i) {
        var isAns = showAns && r.kind === q.answer, isMine = r.kind === choice;
        var item = el('<span style="display:inline-flex;align-items:baseline;gap:6px"></span>');
        if (i > 0) item.appendChild(el('<span style="color:var(--fg3);margin:0 10px">›</span>'));
        var nm = el('<span></span>');
        nm.style.cssText = i === 0
          ? 'font-family:var(--mincho);font-size:22px;font-weight:600'
          : 'font-size:16px;color:' + (i === 1 ? 'var(--fg)' : 'var(--fg2)');
        nm.textContent = (i + 1) + '. ' + Y.KINDS[r.kind].short;
        item.appendChild(nm);
        if (isAns) item.appendChild(el('<span style="color:var(--ok)">●</span>'));
        if (isMine) item.appendChild(el('<span style="color:var(--warn);font-size:13px">あなた</span>'));
        line.appendChild(item);
      });
      return line;
    }
    function numRows(list, title) {
      var box = document.createElement('div');
      box.appendChild(el('<div style="font-size:14px;color:var(--fg2);margin:10px 0 4px">' + title + '</div>'));
      list.forEach(function (r, i) {
        var isAns = r.kind === q.answer;
        var line = el('<div class="cmp" style="margin-bottom:6px"></div>');
        line.appendChild(el('<span class="lab" style="width:130px">' + (i + 1) + '. ' + Y.KINDS[r.kind].short +
          (isAns ? ' <span style="color:var(--ok)">●</span>' : '') + '</span>'));
        var tr = el('<div class="track" style="height:14px"></div>');
        var fl = el('<div class="fill"></div>');
        fl.style.width = Math.max(1, Math.round(r.p * 100)) + '%';   // ★絶対値。相対にすると1位が常に満タンになる
        fl.style.background = isAns ? 'var(--ok)' : 'var(--fg3)';
        fl.style.opacity = '.6';
        tr.appendChild(fl); line.appendChild(tr);
        line.appendChild(el('<span class="num">' + (r.p * 100 < 1 ? '<1' : Math.round(r.p * 100)) + '%</span>'));
        box.appendChild(line);
      });
      return box;
    }

    c.appendChild(el('<div class="sect">この河から考えられる可能性の順</div>'));
    c.appendChild(rankLine(q.ranking, true));
    c.appendChild(el('<div class="note" style="margin-top:2px">緑の●が実際の手。' +
      '「河の形がどれに近いか」の順で、このドリルが作る河を各種220本ずつ用意して比べたものです。</div>'));

    // ★実戦での目安。公開されている役の出現率を事前確率として掛ける
    c.appendChild(el('<div class="sect">実戦での目安（手役の出現率を織り込んだ順）</div>'));
    c.appendChild(rankLine(q.posterior, true));
    c.appendChild(el('<div class="note" style="margin-top:2px">実戦では和了の約9割が普通の手で、染め手は約7%、チートイは約2%、チャンタは約1%（天鳳の役統計）。' +
      'その割合を上の「河の近さ」に掛けた順です。<b>はっきりした河でないと、手役の可能性は思ったほど上がりません。</b>' +
      '河の形の読み（上）と、実際にどれくらい疑うか（ここ）は、分けて覚えてください。</div>'));

    var numBtn = el('<button class="act sm" style="margin-top:10px">近さの数字を見る</button>');
    var numBox = document.createElement('div');
    numBox.hidden = true;
    numBox.appendChild(numRows(q.ranking, '河の形の近さ'));
    numBox.appendChild(numRows(q.posterior, '実戦での目安'));
    numBox.appendChild(el('<div class="note">数字は「その順位がどれくらいはっきりしているか」の目安です。90%台なら、ほぼその手。50〜60%台なら2位も同じくらい疑ってください。</div>'));
    numBtn.onclick = function () { numBox.hidden = !numBox.hidden; numBtn.textContent = numBox.hidden ? '近さの数字を見る' : '数字を閉じる'; };
    c.appendChild(numBtn);
    c.appendChild(numBox);

    c.appendChild(el('<div class="sect">河</div>'));
    c.appendChild(riverRack(q.river));
    c.appendChild(el('<div class="callout ' + (v.key === 'hit' ? 'ok' : 'warn') + '">' + Y.why(q) + '</div>'));

    // ★根拠は数字で出す
    c.appendChild(el('<div class="sect">河から数えられること</div>'));
    var tbl = document.createElement('div');
    Y.evidence(q).forEach(function (e) {
      tbl.appendChild(el('<div style="display:flex;gap:14px;padding:5px 0;border-bottom:1px solid var(--hair)">' +
        '<span style="width:190px;flex:none;color:var(--fg2);font-size:14.5px">' + e.k + '</span>' +
        '<span style="font-size:15.5px">' + e.v + '</span></div>'));
    });
    c.appendChild(tbl);

    if (q.answer === 'chiitoi') {
      c.appendChild(el('<div class="callout warn">チートイの待ちは<b>必ず単騎</b>です。スジもまたぎ筋も裏筋も効きません。' +
        '効くのは<b>その牌が何枚見えているか</b>だけ。3枚見えていれば安全、1枚も見えていなければ危険です。</div>'));
    }
    if (q.answer === 'honitsu' || q.answer === 'chanta') {
      c.appendChild(el('<div class="callout warn">この手が相手だと、<b>安全牌の順番が入れ替わります。</b>' +
        '字牌と1・9牌が安全なのは、相手が普通の手のときだけです。</div>'));
    }
    if (q.answer === 'normal') {
      c.appendChild(el('<div class="callout ok">普通の手（タンピン系）が相手なら、当たり牌は<b>中張牌</b>に寄ります。' +
        '字牌と1・9牌が安全、というふだんの物差しがそのまま使えます。</div>'));
    }

    c.appendChild(nextButton(afterAnswer));
    render(c);
  }
})();

</script>
